# Config lives here rather than in pyproject.toml so pytest's rootdir is tests/.
# The repo root carries an __init__.py (ComfyUI loads the pack as a package); if
# it were the rootdir, pytest would try to import that file with no parent
# package and fail on its relative imports. The pack is imported deliberately,
# under the `nulldxx_comfy` alias, by tests/comfy_stubs.py.
[pytest]
# Puts tests/ on sys.path so `from comfy_stubs import ...` resolves.
pythonpath = .
addopts = --import-mode=importlib
